name: CI

# CPU-only syntax and logic checks. Deliberately does NOT run training or
# inference, which need a GPU and real model weights - run those manually per
# README.md before merging changes to training/inference logic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check every Python file
        run: |
          for f in *.py; do echo "compiling $f"; python3 -m py_compile "$f"; done
      - name: Syntax-check every shell script
        run: |
          for f in *.sh; do echo "checking $f"; bash -n "$f"; done

  logic-tests:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: |
          pip install sympy datasets huggingface_hub matplotlib graphviz markdown
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: reward_fn.py self-test
        run: python3 reward_fn.py
      - name: hardware_utils.py detection
        run: python3 hardware_utils.py
      - name: check_environment.py (report only, installs nothing)
        run: python3 check_environment.py
      - name: generate_diagrams.py renders all diagrams
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          python3 generate_diagrams.py --all --out_dir /tmp/ci_diagrams
          ls -la /tmp/ci_diagrams
